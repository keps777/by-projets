<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E6E6FA}

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121318; color: #F3F3F5; font-family: Geist, system-ui, sans-serif; padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Quitter le mode Focus" style="width: 44px; height: 44px; border-radius: 22px; background: #22242C; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9ABB5">Mode Focus</span>
    <span style="width: 44px"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
    <span style="font-size: 12px; font-weight: 600; color: #A9AAF0">Ma relation avec Dieu · La lecture de la Bible</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Matthieu 7–9</h1>
  </div>

  <div style="align-self: center; width: 250px; height: 250px; position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="250" height="250" viewBox="0 0 250 250" style="position: absolute; inset: 0">
      <circle cx="125" cy="125" r="110" fill="none" stroke="#262833" stroke-width="12"></circle>
      <circle cx="125" cy="125" r="110" fill="none" stroke="#7577F0" stroke-width="12" stroke-linecap="round" stroke-dasharray="691" stroke-dashoffset="400" transform="rotate(-90 125 125)"></circle>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-family: 'Geist Mono', monospace; font-size: 48px; font-weight: 500; letter-spacing: -0.02em">17:24</span>
      <span style="font-size: 13px; color: #A9ABB5">restantes sur 30 min</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; color: #A9ABB5">Chapitres lus</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 48px; border-radius: 14px; border: 0; background: #4446C9; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Mt 7</button>
      <button style="height: 48px; border-radius: 14px; border: 0; background: #4446C9; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Mt 8</button>
      <button style="height: 48px; border-radius: 14px; border: 1px solid #3A3D4A; background: transparent; color: #F3F3F5; font-weight: 600">Mt 9</button>
    </div>
  </div>

  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; color: #A9ABB5">
    Ce que Dieu me dit
    <textarea rows="3" style="font: 15px/1.4 Geist, sans-serif; color: #F3F3F5; background: #1C1E25; border: 1px solid #2E3039; border-radius: 16px; padding: 12px 14px; resize: none">Mt 7:24 : bâtir sur le roc. Mettre en pratique, pas seulement écouter.</textarea>
  </label>

  <div style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px; line-height: 1.3; color: #C9CAD2; text-align: center">« Ta parole est une lampe à mes pieds. »</div>

  <a href="Main.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: #F3F3F5; color: #121318; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    Terminer et marquer fait
  </a>
