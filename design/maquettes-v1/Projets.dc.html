<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Thèmes et projets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16171B}a:hover{color:#000}
button{font:inherit;color:inherit}
.scr::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F5F4F0; color: #16171B; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <div class="scr" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Luther Life</h1>
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px; color: #3A3B42">Diviser ma vie en plusieurs projets.</span>
      <span style="font-size: 13px; color: #5E6068">4 thèmes · 25 projets · 14 sous-projets actifs</span>
    </div>

    <sc-for list="{{themes}}" as="t" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #FFFFFF; background: {{t.c}}; width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center">{{t.n}}</span>
          <h2 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">{{t.nom}}</h2>
          <span style="font-size: 12px; font-weight: 600; color: {{t.ink}}">{{t.pct}} %</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{t.projets}}" as="p" hint-placeholder-count="4">
            <a href="SousProjet.dc.html" style="text-decoration: none; color: #16171B; background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 76px; box-sizing: border-box">
              <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #5E6068">Projet {{p.n}}</span>
              <span style="font-size: 14px; font-weight: 600; line-height: 1.2">{{p.nom}}</span>
              <span style="margin-top: auto; display: flex; align-items: center; gap: 6px">
                <span style="flex: 1; height: 4px; border-radius: 2px; background: #EDEBE6; overflow: hidden"><span style="display: block; height: 4px; width: {{p.pct}}%; background: {{t.c}}"></span></span>
                <span style="font-size: 11px; color: #5E6068">{{p.etat}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; background: #F5F4F0; border-top: 1px solid #E3E1DB">
    <a href="Main.dc.html" style="text-decoration: none; color: #5E6068; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h3M4 12h3M4 18h3"></path><path d="M10 6h10M10 12h7M10 18h10"></path></svg>Le Fil</a>
    <a href="Semaine.dc.html" style="text-decoration: none; color: #5E6068; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Semaine</a>
    <a href="Projets.dc.html" style="text-decoration: none; color: #16171B; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Projets</a>
    <a href="Ebenezer.dc.html" style="text-decoration: none; color: #5E6068; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14"></path><path d="M7 20l1.5-9L12 6l3.5 5L17 20"></path></svg>Ebenezer</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    function P(n, nom, pct, etat) { return { n: n, nom: nom, pct: pct, etat: etat }; }
    return {
      themes: [
        { n: 1, nom: 'Ma relation avec Dieu', c: '#4446C9', ink: '#25267A', pct: 68, projets: [
          P(1, 'La lecture de la Bible', 20, '20 %'), P(2, 'RDQD', 84, '84 %'), P(3, 'La prière seule', 71, '71 %'),
          P(4, 'LLC', 0, 'à définir'), P(5, 'PWO', 0, 'à définir'), P(6, 'Le jeûne', 50, '50 %'),
          P(7, 'Le don à Dieu', 100, 'à jour'), P(8, 'Le don à l’homme', 60, '60 %'), P(24, 'Ma conformité au Message de Base', 40, '40 %') ] },
        { n: 2, nom: 'Mon service à Dieu', c: '#0B7F72', ink: '#08524A', pct: 49, projets: [
          P(9, 'L’évangélisation', 54, '54 %'), P(10, 'Le gagnement des âmes', 30, '30 %'),
          P(11, 'La formation des disciples', 45, '45 %'), P(15, 'Dons aux frères', 80, '80 %') ] },
        { n: 3, nom: 'Mon travail et mes études', c: '#2B67A8', ink: '#183F6A', pct: 38, projets: [
          P(12, 'L’excellence professionnelle', 40, '40 %'), P(13, 'Mon projet d’entrepreneuriat', 10, '10 %'),
          P(14, 'L’excellence académique', 45, '45 %') ] },
        { n: 4, nom: 'Ma vie personnelle', c: '#B4542F', ink: '#6E2E14', pct: 41, projets: [
          P(16, 'La gestion de mes finances', 35, '35 %'), P(17, 'Ma garde-robe', 0, 'à définir'),
          P(18, 'L’entretien de mon logement', 57, '57 %'), P(19, 'La forme physique', 33, '33 %'),
          P(20, 'L’achat d’une maison', 12, '12 %'), P(21, 'La préparation pour le mariage', 30, '30 %'),
          P(22, 'Le mariage', 0, 'à venir'), P(23, 'La relation avec ma famille', 65, '65 %') ] },
        { n: '∞', nom: 'Transversal', c: '#B07400', ink: '#5E3E00', pct: 80, projets: [
          P(25, 'Le suivi de tous les projets', 80, '80 %') ] }
      ]
    };
  }
}
</script>
</body>
</html>
