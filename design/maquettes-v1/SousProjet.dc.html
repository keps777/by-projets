<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sous-projet — suivi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16171B}a:hover{color:#000}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F5F4F0; color: #16171B; font-family: Geist, system-ui, sans-serif; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Projets.dc.html" aria-label="Retour aux projets" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3E1DB; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 12px; font-weight: 600; color: #25267A; line-height: 1.3">Ma relation avec Dieu ›<br>Projet 1 · La lecture de la Bible</span>
  </div>

  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">L’Évangile de Matthieu, 3 chapitres par jour</h1>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EAE8E3; border-radius: 14px; padding: 4px; gap: 2px">
    <button style="height: 38px; border: 0; border-radius: 10px; background: #FFFFFF; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">Suivi</button>
    <button style="height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 500; color: #3A3B42">Fiche</button>
    <a href="Document.dc.html" style="height: 38px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #3A3B42; text-decoration: none; display: flex; align-items: center; justify-content: center">Document</a>
    <button style="height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 500; color: #3A3B42">Temps</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">20 %</span><span style="font-size: 11px; color: #5E6068">2 lignes sur 10</span></div>
    <div style="background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">6 / 28</span><span style="font-size: 11px; color: #5E6068">chapitres</span></div>
    <div style="background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">À jour</span><span style="font-size: 11px; color: #5E6068">fin le 12 oct.</span></div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 54px 1fr 44px 40px; gap: 6px; padding: 10px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6068; border-bottom: 1px solid #EDEBE6">
      <span>Date</span><span>Prévu</span><span style="text-align: center">Fait</span><span style="text-align: right">Val.</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="display: grid; grid-template-columns: 54px 1fr 44px 40px; gap: 6px; padding: 0 12px; min-height: 44px; align-items: center; background: {{r.bg}}; border-bottom: 1px solid #EDEBE6">
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5E6068">{{r.date}}</span>
        <span style="display: flex; flex-direction: column; padding: 6px 0; min-width: 0">
          <span style="font-size: 14px; font-weight: {{r.fw}}">{{r.etape}}</span>
          <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; color: #5E6068; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span>
          </sc-if>
        </span>
        <span style="display: flex; justify-content: center">
          <span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid {{r.bc}}; background: {{r.cb}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
            <sc-if value="{{r.done}}" hint-placeholder-val="{{false}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </span>
        </span>
        <span style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px">{{r.val}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var lignes = [
      ['3 oct.', 'Matthieu 1–3', 'done', '3', 'La généalogie : Dieu écrit avec des vies réelles'],
      ['4 oct.', 'Matthieu 4–6', 'done', '3', 'Ch. 5 à relire, les Béatitudes'],
      ['5 oct.', 'Matthieu 7–9', 'today', '', 'Aujourd’hui · 05:45'],
      ['6 oct.', 'Matthieu 10–12', '', '', ''],
      ['7 oct.', 'Matthieu 13–15', '', '', ''],
      ['8 oct.', 'Matthieu 16–18', '', '', ''],
      ['9 oct.', 'Matthieu 19–21', '', '', ''],
      ['10 oct.', 'Matthieu 22–24', '', '', ''],
      ['11 oct.', 'Matthieu 25–27', '', '', ''],
      ['12 oct.', 'Matthieu 28', '', '', '']
    ];
    return {
      rows: lignes.map(function (l) {
        var done = l[2] === 'done', today = l[2] === 'today';
        return {
          date: l[0], etape: l[1], val: l[3] || '—', note: l[4], hasNote: !!l[4], done: done,
          bg: today ? '#EEEEFC' : '#FFFFFF', fw: today ? 600 : 500,
          bc: done ? '#4446C9' : (today ? '#4446C9' : '#CFCDC6'), cb: done ? '#4446C9' : '#FFFFFF'
        };
      })
    };
  }
}
</script>
</body>
</html>
