<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Archives des rapports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0E0F13; color: #F2F2F5; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Rapport.dc.html" aria-label="Retour aux rapports" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #17181E; border: 1px solid #2A2C35; color: #F2F2F5; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Archives</h1>
    </div>

    <label style="display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 14px; background: #17181E; border: 1px solid #2A2C35; padding: 0 12px; color: #A3A6B1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input aria-label="Rechercher un rapport" placeholder="Rechercher : « BR 0/7 », « septembre »…" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F2F2F5; font: inherit; font-size: 15px; outline: none">
    </label>

    <div style="display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none">
      <button style="flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: #F2F2F5; color: #0E0F13; font: inherit; font-size: 13px; font-weight: 600">Tous</button>
      <button style="flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2A2C35; background: transparent; color: #F2F2F5; font: inherit; font-size: 13px; font-weight: 600">Jours</button>
      <button style="flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2A2C35; background: transparent; color: #F2F2F5; font: inherit; font-size: 13px; font-weight: 600">Semaines</button>
      <button style="flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2A2C35; background: transparent; color: #F2F2F5; font: inherit; font-size: 13px; font-weight: 600">Mois</button>
      <button style="flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2A2C35; background: transparent; color: #F2F2F5; font: inherit; font-size: 13px; font-weight: 600">Envoyés</button>
    </div>

    <a href="RapportMois.dc.html" style="text-decoration: none; color: #F2F2F5; background: #1B1A2E; border: 1px solid #34305A; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 14px">
      <span style="flex: none; width: 58px; height: 58px; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="58" height="58" viewBox="0 0 58 58" style="position: absolute; inset: 0"><circle cx="29" cy="29" r="24" fill="none" stroke="#2E2A50" stroke-width="6"></circle><circle cx="29" cy="29" r="24" fill="none" stroke="#9D8CFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="33" transform="rotate(-90 29 29)"></circle></svg>
        <span style="font-family: 'Geist Mono', monospace; font-size: 13px">78 %</span>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #BDB3FF">Rapport mensuel</span>
        <span style="font-size: 17px; font-weight: 600">Septembre 2026</span>
        <span style="font-size: 12px; color: #A3A6B1">30 rapports · 1 livre terminé · 3 âmes gagnées</span>
      </span>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 600">Semaine 40 · 28 sept. – 4 oct.</span>
        <a href="RapportSemaine.dc.html" style="color: #BDB3FF; font-size: 13px; font-weight: 600; min-height: 32px; display: flex; align-items: center">Récap · 74 %</a>
      </div>
      <div style="background: #17181E; border: 1px solid #2A2C35; border-radius: 20px; overflow: hidden">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <a href="Rapport.dc.html" style="text-decoration: none; color: #F2F2F5; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #23252E; min-height: 44px">
            <span style="flex: none; width: 40px; display: flex; flex-direction: column; align-items: center">
              <span style="font-size: 11px; color: #A3A6B1">{{d.wd}}</span>
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">{{d.num}}</span>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="display: flex; gap: 3px">
                <sc-for list="{{d.dots}}" as="c" hint-placeholder-count="12">
                  <span style="flex: 1; height: 6px; border-radius: 3px; background: {{c}}"></span>
                </sc-for>
              </span>
              <span style="font-size: 12px; color: #A3A6B1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.line}}</span>
            </span>
            <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
              <span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{d.score}}</span>
              <sc-if value="{{d.sent}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 10px; font-weight: 600; color: #7BE3A8">envoyé</span>
              </sc-if>
            </span>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Semaine 39 · 21 – 27 sept.</span>
      <div style="background: #17181E; border: 1px solid #2A2C35; border-radius: 20px; padding: 14px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; color: #A3A6B1">7 rapports · 6 envoyés</span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 13px">81 %</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function rnd(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['Dim.', 4, '5/12', 'DDEWG 2/3 · PA ~2h15 · BR 0/7 ch · CL 166/417', true],
      ['Sam.', 3, '9/12', 'DDEWG 3/3 · PA 2h05 · BR 7/7 ch · CL 142/417', true],
      ['Ven.', 2, '8/12', 'DDEWG 3/3 · PA 1h50 · BR 9/7 ch · CL 120/417', true],
      ['Jeu.', 1, '10/12', 'DDEWG 3/3 · PA 2h20 · BR 7/7 ch · EVANG 1h30', true],
      ['Mer.', 30, '7/12', 'DDEWG 2/3 · PA 1h40 · BR 4/7 ch · CL 96/417', false],
      ['Mar.', 29, '9/12', 'DDEWG 3/3 · PA 2h00 · BR 7/7 ch · DISCIPLES 1/1', true],
      ['Lun.', 28, '8/12', 'DDEWG 3/3 · PA 2h10 · BR 4/7 ch · CL 68/417', true]
    ];
    return {
      days: rows.map(function (r, i) {
        var score = parseInt(r[2], 10), dots = [];
        for (var j = 0; j < 12; j++) {
          var hit = rnd(i * 13 + j * 7) < score / 12;
          dots.push(hit ? '#5BD893' : (rnd(j * 3 + i) > 0.5 ? '#6C5FC7' : '#3A2025'));
        }
        return { wd: r[0], num: r[1], score: r[2], line: r[3], sent: r[4], dots: dots };
      })
    };
  }
}
</script>
</body>
</html>
