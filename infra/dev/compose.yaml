# AM-018 · Environnement « dev » : un hôte Docker (VM ou serveur), PostgreSQL + API + web.
# Copié sur l'hôte par le workflow de déploiement dans $DEV_DEPLOY_PATH (défaut ~/afrimove).
# Les versions déployées viennent de .env (écrit par ctl.sh) : WEB_IMAGE, WEB_TAG, API_IMAGE, API_TAG.
# Les secrets (POSTGRES_PASSWORD, DATABASE_URL, …) vivent dans secrets.env sur l'hôte, jamais dans le dépôt.
name: afrimove-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: secrets.env
    environment:
      POSTGRES_USER: afrimove
      POSTGRES_DB: afrimove
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrimove -d afrimove"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Pas de port publié : seule l'API joint la base.

  api:
    image: ${API_IMAGE:-afrimove-api}:${API_TAG:-none}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: secrets.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  web:
    image: ${WEB_IMAGE:-afrimove-web}:${WEB_TAG:-none}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
