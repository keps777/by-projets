# AM-018 · Nginx de l'application web (PWA). TLS et CDN sont devant, ce conteneur parle HTTP sur 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Sonde de santé (conteneur, répartiteur, CDN).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le service worker et le manifeste ne doivent jamais être servis périmés,
    # sinon une mise en ligne (ou un retour arrière) n'atteint pas les appareils.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fichiers à empreinte (Vite) et polices woff2 : cache longue durée.
    location ~* ^/(assets|fonts)/.+\.(js|css|woff2|woff|svg|png|jpg|jpeg|webp|avif|ico|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue retombe sur index.html (jamais mis en cache).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
