# AM-018 · Intégration continue
# lint, typecheck, test, build sur chaque PR et chaque push sur main ;
# banc de fidélité maquette ↔ app quand l'interface change.
# Le job « ci-ok » est le seul contrôle à déclarer « requis » dans la protection de branche main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # La version de pnpm est lue dans package.json (champ packageManager) par pnpm/action-setup.
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  # ------------------------------------------------------------------
  # Détecte si l'interface a changé (décide du banc de fidélité).
  # ------------------------------------------------------------------
  changes:
    name: Fichiers touchés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Interface touchée ?
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Chemins qui changent le rendu d'un écran : appli web, kit UI (demandé par le ticket),
          # plus tokens, données de démo, le banc lui-même et les maquettes de référence.
          PATHS=(apps/web packages/ui packages/design packages/fixtures tools/fidelite docs/maquettes-v3)
          ui=false
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Pas de base fiable (lancement manuel, première poussée) : on joue le banc par prudence.
            ui=true
          elif ! git diff --quiet "$base" HEAD -- "${PATHS[@]}"; then
            ui=true
          fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "Interface touchée : $ui" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # lint · typecheck · test · build, en parallèle.
  # ------------------------------------------------------------------
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.task }}-${{ runner.os }}-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: pnpm ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

      # Prévisualisation de l'appli web par PR : le build statique est joint à l'exécution.
      # Tant que apps/web n'a pas son build Vite, il n'y a pas de dist et l'étape est ignorée.
      - name: Détecter le build web
        if: matrix.task == 'build'
        id: web_dist
        run: |
          if [ -f apps/web/dist/index.html ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Joindre la prévisualisation web
        if: matrix.task == 'build' && steps.web_dist.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-web-${{ github.event.pull_request.number || github.sha }}
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Banc de fidélité : seulement si l'interface a changé.
  # Tolérant tant que AM-004 n'est pas fusionné (script « fidelite » encore un espace réservé).
  # ------------------------------------------------------------------
  fidelite:
    name: Banc de fidélité
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Le banc est-il livré (AM-004) ?
        id: banc
        run: |
          set -euo pipefail
          script="$(node -p "require('./tools/fidelite/package.json').scripts?.fidelite ?? ''")"
          echo "Script fidelite : $script"
          # Espace réservé d'AM-001 : « echo 'banc de fidélité : voir ticket AM-004' ».
          if [ -z "$script" ] || printf '%s' "$script" | grep -Eq '^echo[[:space:]]|AM-004'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Banc de fidélité ignoré::AM-004 n'est pas encore fusionné (script fidelite = espace réservé). Le job deviendra bloquant dès sa fusion."
            echo "Banc de fidélité ignoré : AM-004 pas encore fusionné." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Chromium pour Playwright
        if: steps.banc.outputs.ready == 'true'
        run: pnpm --filter @afrimove/fidelite exec playwright install --with-deps chromium

      - name: pnpm fidelite --all
        if: steps.banc.outputs.ready == 'true'
        run: pnpm fidelite --all

      - name: Joindre le rapport du banc
        if: always() && steps.banc.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-fidelite-${{ github.event.pull_request.number || github.sha }}
          path: tools/fidelite/sortie
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Point de contrôle unique pour la protection de branche.
  # ------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, check, fidelite]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tout est vert (ou volontairement ignoré)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Un job a échoué ou été annulé ($r)"; exit 1 ;;
            esac
          done
