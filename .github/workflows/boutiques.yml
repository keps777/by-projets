# AM-184 · Emballage Capacitor pour le Play Store et l'App Store
#
# - Chaque PR qui touche l'emballage : le build web embarqué est identique à dist/ et passe le banc de fidélité sur
#   Main ; le projet Android se compile.
# - Lancement manuel ou étiquette `boutiques-v*` : AAB Android signé (clé d'envoi) joint à l'exécution ; avec
#   `ios: true` (ou une étiquette), compilation du projet iOS sur macOS, sans signature.
# La publication elle-même (Play Console, App Store Connect) attend les comptes développeur : voir
# docs/publication-boutiques.md. Aucun secret n'est dans le dépôt ; ils sont listés dans ce document.
name: Boutiques

on:
  pull_request:
    paths:
      - "apps/web/android/**"
      - "apps/web/ios/**"
      - "apps/web/capacitor.config.ts"
      - "apps/web/resources/**"
      - ".github/workflows/boutiques.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi le projet iOS (runner macOS, plus cher)"
        type: boolean
        default: false
      version_name:
        description: "Nom de version affiché dans les boutiques (ex. 1.0.0)"
        type: string
        default: "1.0.0"
  push:
    tags: ["boutiques-v*"]

concurrency:
  group: boutiques-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  TURBO_TELEMETRY_DISABLED: "1"
  CI: "true"
  # Adresses figées dans le build (variables du dépôt, pas des secrets) :
  # API appelée par l'application et hôte des liens web qui l'ouvrent (Android App Links / Universal Links).
  VITE_API_URL: ${{ vars.BOUTIQUES_API_URL }}
  VITE_LIENS_HOTES: ${{ vars.BOUTIQUES_HOTE_LIENS }}
  AFRIMOVE_APP_HOST: ${{ vars.BOUTIQUES_HOTE_LIENS }}

jobs:
  # ------------------------------------------------------------------
  # « Un seul build web » : ce que Capacitor embarque est exactement dist/, et il passe le banc de fidélité.
  # Build en mode démo (VITE_APP_ENV=dev) : c'est le mode que le banc exige ; le code est le même que celui du
  # build de production, seules les variables d'environnement changent.
  # ------------------------------------------------------------------
  embarque:
    name: Build web embarqué et fidélité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Le banc tourne sur les données de démonstration : aucune API réelle ne doit être appelée.
      VITE_API_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le web et le synchroniser dans android/ et ios/
        run: pnpm --filter @afrimove/web run cap:sync

      - name: Le web embarqué est celui de dist/
        run: |
          set -euo pipefail
          cd apps/web
          # cordova.js et cordova_plugins.js sont ajoutés par Capacitor ; tout le reste doit être identique.
          diff -r -x cordova.js -x cordova_plugins.js dist android/app/src/main/assets/public
          diff -r -x cordova.js -x cordova_plugins.js dist ios/App/App/public
          echo "Web embarqué identique à dist/ (Android et iOS)." >> "$GITHUB_STEP_SUMMARY"

      - name: Installer Chromium pour Playwright
        run: pnpm --filter @afrimove/fidelite exec playwright install --with-deps chromium

      - name: Banc de fidélité sur Main, servi depuis les fichiers embarqués d'Android
        run: |
          set -euo pipefail
          PORT=5731 pnpm --filter @afrimove/web exec vite preview --outDir android/app/src/main/assets/public &
          serveur=$!
          trap 'kill "$serveur" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5731/voyager >/dev/null && break
            sleep 1
          done
          pnpm fidelite Main --app-url http://localhost:5731

      - name: Joindre le rapport du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelite-main-embarque-${{ github.run_number }}
          path: tools/fidelite/sortie
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Android : AAB de production. Signé si les secrets existent, sinon simple vérification de compilation.
  # ------------------------------------------------------------------
  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # SDK Android déjà présent sur les runners GitHub (ANDROID_HOME) ; Gradle télécharge le reste.
      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Clé d'envoi disponible ?
        id: cle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Jamais de signature sur une PR (même du dépôt) : seules les exécutions manuelles et les étiquettes signent.
          if [ -n "${KEYSTORE_B64:-}" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "signe=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle-envoi.jks"
          else
            echo "signe=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AAB non signé::pas de secret ANDROID_KEYSTORE_BASE64 (ou exécution de PR) : compilation vérifiée, AAB non utilisable pour la publication."
          fi

      - name: AAB signé (production)
        if: steps.cle.outputs.signe == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cle-envoi.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le Play Store exige un code de version strictement croissant : numéro d'exécution du workflow.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VITE_APP_ENV: production
        run: pnpm --filter @afrimove/web run cap:android

      - name: AAB non signé (vérification de compilation)
        if: steps.cle.outputs.signe != 'true'
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VITE_APP_ENV: production
        run: |
          set -euo pipefail
          pnpm --filter @afrimove/web exec vite build
          pnpm --filter @afrimove/web exec cap sync android
          cd apps/web/android
          ./gradlew bundleRelease -Pafrimove.sansSignature=true

      - name: Vérifier la signature
        if: steps.cle.outputs.signe == 'true'
        run: |
          set -euo pipefail
          # « jar verified » (la chaîne du certificat d'envoi n'est pas connue du JDK : avertissement normal).
          jarsigner -verify apps/web/android/app/build/outputs/bundle/release/app-release.aab | head -3

      - name: Joindre l'AAB
        uses: actions/upload-artifact@v4
        with:
          name: afrimove-${{ steps.cle.outputs.signe == 'true' && 'signe' || 'non-signe' }}-${{ github.run_number }}.aab
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: ${{ steps.cle.outputs.signe == 'true' && 30 || 7 }}
          if-no-files-found: error

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/cle-envoi.jks"

  # ------------------------------------------------------------------
  # iOS : le projet se compile avec Xcode (simulateur, sans signature). L'archive App Store demande le compte
  # Apple Developer : voir docs/publication-boutiques.md.
  # ------------------------------------------------------------------
  ios:
    name: iOS (compilation)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le web et synchroniser iOS
        env:
          VITE_APP_ENV: production
        run: |
          set -euo pipefail
          pnpm --filter @afrimove/web exec vite build
          pnpm --filter @afrimove/web exec cap sync ios

      - name: Compiler le projet Xcode (simulateur, sans signature)
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
